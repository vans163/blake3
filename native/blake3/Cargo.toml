[package]
name = "blake3"
version = "1.0.1"

[features]
default = ["blake3/default", "blake3/rayon"]
neon = ["blake3/neon"]
rayon = ["blake3/rayon"]

[lib]
name = "blake3"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.36.1"
rustler_codegen = "0.36.1"
bincode = "2.0.1"
blake3 = "1.0"
